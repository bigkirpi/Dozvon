name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Распаковать проект
        run: |
          mkdir -p project
          unzip -o "*.zip" -d project

      - name: Настроить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установить Gradle
        run:       - name: Установить Gradle
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d /tmp
          echo "/tmp/gradle-8.11.1/bin" >> $GITHUB_

      - name: Собрать APK
        run: |
          DIR=$(find project -type f -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          if [ -z "$DIR" ]; then
            echo "Файл настроек Gradle не найден!"
            exit 1
          fi
          cd "$(dirname "$DIR")"
          gradle assembleDebug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: project/**/build/outputs/apk/**/*.apk
